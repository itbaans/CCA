[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "carecloud-voice-registration"
version = "1.0.0"
description = "Voice AI patient registration service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings==2.10.1",
  "email-validator==2.2.0",
  "python-multipart==0.0.20",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "anyio==4.10.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
