services:
  - type: web
    name: carecloud-voice-registration
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: carecloud-patients
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        sync: false

databases:
  - name: carecloud-patients
    plan: free
    region: oregon
    databaseName: carecloud
    user: carecloud
